[project]
name = "patreonmcp"
version = "0.1.0"
description = "MCP server for Patreon API v2 reads plus web editor post writes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Andre Anjos" }]
keywords = ["patreon", "mcp", "model-context-protocol", "creator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx2>=2.5",
    "mcp>=2.3.0,<3",
    "pydantic>=2.11",
    "uvicorn>=0.30",
]

[project.scripts]
patreonmcp = "patreonmcp.cli:main"

[project.urls]
Repository = "https://github.com/andreanjos/patreonmcp"
Issues = "https://github.com/andreanjos/patreonmcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patreonmcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
